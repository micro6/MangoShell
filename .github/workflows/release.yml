name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            rustTargets: x86_64-pc-windows-msvc
            args: --bundles nsis
          - name: linux-x64
            platform: ubuntu-22.04
            rustTargets: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
          - name: macos-universal
            platform: macos-latest
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile

      # 更新源依赖仓库地址，在这里拼进构建时配置，避免把 owner/repo 写死进仓库
      - name: 生成更新源配置
        shell: bash
        run: |
          cat > src-tauri/tauri.release.conf.json <<EOF
          {
            "bundle": { "createUpdaterArtifacts": true },
            "plugins": {
              "updater": {
                "endpoints": ["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]
              }
            }
          }
          EOF

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未配置该 Secret 时构建会因缺少更新签名失败，详见 README 的发布说明
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: MangoShell v__VERSION__
          releaseBody: |
            各平台安装包见下方 Assets。

            安装包未做平台代码签名：Windows SmartScreen 与 macOS Gatekeeper 会提示未知开发者，
            需手动放行后运行。应用内自动更新使用独立的更新签名校验。
          # 自动更新依赖 latest.json，草稿发布会读不到，这里直接发布
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
